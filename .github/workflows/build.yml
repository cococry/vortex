name: build

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel meson ninja \
            wayland wayland-protocols libxkbcommon pixman \
            mesa libglvnd libdrm libinput systemd-libs seatd \
            glfw freetype2 harfbuzz libliftoff libxcursor

      - uses: actions/checkout@v4

      # vortex must stay warning-free, vendored runara still has upstream ones
      - name: Configure
        run: meson setup build -Dwerror=true -Drunara:werror=false

      - name: Compile
        run: meson compile -C build
