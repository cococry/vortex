
name: Build

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git meson ninja pkgconf

      - name: Install runara dependencies
        run: |
          pacman -S --noconfirm --needed \
            cglm mesa libglvnd \
            vulkan-headers vulkan-icd-loader \
            shaderc glslang python

      - name: Install vortex dependencies
        run: |
          pacman -S --noconfirm --needed \
            wayland wayland-protocols \
            libxkbcommon pixman \
            mesa libglvnd libdrm \
            libinput systemd-libs seatd \
            libliftoff libxcursor libx11 libxcb libxkbcommon-x11

      - uses: actions/checkout@v4

      - name: Configure
        run: |
          meson setup build \
            -Dbackends=all \
            -Drenderers=all \
            -Dwerror=true \
            --buildtype=debug

      - name: Compile
        run: meson compile -C build

